<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusCare | Admin</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e7eaf0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: #315efb;
            color: white;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-badge {
            background: #172033;
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
        }

        .container {
            max-width: 1250px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .header p {
            color: #727c8f;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid #e7eaf0;
            border-radius: 18px;
            padding: 22px;
        }

        .stat-label {
            color: #7b8495;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 800;
        }

        .main {
            background: white;
            border: 1px solid #e7eaf0;
            border-radius: 22px;
            padding: 28px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .toolbar h2 {
            font-size: 21px;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter {
            border: 1px solid #dfe3eb;
            background: white;
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .filter.active {
            background: #315efb;
            color: white;
            border-color: #315efb;
        }

        .issue {
            border: 1px solid #e6e9ef;
            border-radius: 17px;
            padding: 20px;
            margin-bottom: 13px;
        }

        .issue-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .category {
            color: #315efb;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .issue h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .details {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            color: #727c8f;
            font-size: 12px;
        }

        .status {
            height: fit-content;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .pending {
            background: #fff5d9;
            color: #9a6a00;
        }

        .progress {
            background: #eaf2ff;
            color: #2563eb;
        }

        .cleared {
            background: #e8f8ef;
            color: #168348;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 9px;
        }

        .btn {
            border: none;
            padding: 10px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
        }

        .primary {
            background: #315efb;
            color: white;
        }

        .success-btn {
            background: #168348;
            color: white;
        }

        .secondary {
            background: #eef1f6;
            color: #273044;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #8992a2;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 470px;
            border-radius: 22px;
            padding: 30px;
        }

        .modal-box h2 {
            margin-bottom: 8px;
        }

        .modal-box p {
            color: #7b8495;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        select,
        textarea {
            width: 100%;
            border: 1px solid #dfe3eb;
            border-radius: 11px;
            padding: 13px;
            font-family: inherit;
            margin-bottom: 18px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
        }

        @media(max-width: 800px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media(max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .issue-top {
                flex-direction: column;
            }
        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <div class="logo-icon">
            🛠
        </div>

        CampusCare

    </div>


    <div class="admin-badge">
        ADMIN
    </div>

</nav>


<div class="container">


    <div class="header">

        <h1>
            Campus Overview
        </h1>

        <p>
            Monitor and resolve student-reported issues.
        </p>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Total Issues
            </div>

            <div
                class="stat-number"
                id="totalIssues">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Pending
            </div>

            <div
                class="stat-number"
                id="pendingIssues">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                In Progress
            </div>

            <div
                class="stat-number"
                id="progressIssues">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Cleared
            </div>

            <div
                class="stat-number"
                id="clearedIssues">
                0
            </div>

        </div>

    </div>


    <section class="main">


        <div class="toolbar">

            <h2>
                Student Reports
            </h2>


            <div class="filters">

                <button
                    class="filter active"
                    onclick="filterReports('All', this)">
                    All
                </button>

                <button
                    class="filter"
                    onclick="filterReports('Pending', this)">
                    Pending
                </button>

                <button
                    class="filter"
                    onclick="filterReports('In Progress', this)">
                    In Progress
                </button>

                <button
                    class="filter"
                    onclick="filterReports('Cleared', this)">
                    Cleared
                </button>

            </div>

        </div>


        <div id="reportsContainer">

        </div>


    </section>


</div>


<!-- UPDATE MODAL -->

<div
    class="modal"
    id="updateModal">

    <div class="modal-box">

        <h2>
            Update Issue
        </h2>

        <p>
            Change the issue status and send a message to the student.
        </p>


        <label>
            Status
        </label>

        <select id="newStatus">

            <option value="Pending">
                Pending
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Cleared">
                Cleared
            </option>

        </select>


        <label>
            Message to Student
        </label>

        <textarea
            id="adminMessage"
            placeholder="Write an update..."></textarea>


        <div class="modal-actions">

            <button
                class="btn secondary"
                onclick="closeModal()">

                Cancel

            </button>


            <button
                class="btn primary"
                onclick="saveUpdate()">

                Save Update

            </button>

        </div>

    </div>

</div>


<script src="admin.js"></script>

</body>

</html>
